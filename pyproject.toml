[project]
name = "elbow-rehab-cloud"
version = "2.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "postgres: needs a local throwaway PostgreSQL (set PG_TEST_DSN); skipped otherwise",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["*.ipynb", "venv.", ".venv", "data"]

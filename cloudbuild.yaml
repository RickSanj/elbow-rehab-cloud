# Cloud Build configuration for deploying to Cloud Run
# This file automates building and deploying your app on every git push

steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/elbow-rehab-api:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/elbow-rehab-api:latest'
      - '.'
    env:
      - 'DOCKER_BUILDKIT=1'

  # Step 2: Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/elbow-rehab-api:$SHORT_SHA'
    waitFor: ['build']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/run'
    id: 'deploy'
    args:
      - 'deploy'
      - 'elbow-rehab-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/elbow-rehab-api:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'ENVIRONMENT=production'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '3600'
      - '--max-instances'
      - '10'
    env:
      - 'CLOUDSDK_RUN_REGION=us-central1'
    waitFor: ['push']

# Build configuration
images:
  - 'gcr.io/$PROJECT_ID/elbow-rehab-api:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/elbow-rehab-api:latest'

# Store build artifacts
artifacts:
  objects:
    location: 'gs://$PROJECT_ID-builds'
    paths:
      - 'build-artifacts/**'

# Build options
options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: 'ALLOW_LOOSE'

# Build timeout (30 minutes)
timeout: '1800s'

# Substitutions (can be overridden)
substitutions:
  _REGION: 'us-central1'
  _SERVICE_NAME: 'elbow-rehab-api'

# Trigger settings (when to build)
# Trigger on push to main branch
onFailure:
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - 'rollout'
      - 'abort'

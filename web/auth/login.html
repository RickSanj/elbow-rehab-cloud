<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Elbow Rehab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="app-logo">💪</div>
          <h1 class="app-title">Elbow Rehab</h1>
          <p class="auth-subtitle">Doctor Dashboard</p>
        </div>

        <!-- Alert messages -->
        <div id="alertContainer"></div>

        <!-- Login form -->
        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="doctor@example.com"
              required
            />
            <span class="error-message">Please enter a valid email</span>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              required
            />
            <span class="error-message">Password is required</span>
          </div>

          <div class="checkbox-group">
            <input type="checkbox" id="remember" name="remember" />
            <label for="remember">Remember me</label>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">
            Sign In
          </button>
        </form>

        <div class="divider">Or</div>

        <div class="auth-footer">
          <p>
            Don't have an account?
            <a href="signup.html">Create one here</a>
          </p>
          <p style="margin-top: 8px; font-size: 12px;">
            <a href="#" style="color: #7f8c8d;">Forgot password?</a>
          </p>
        </div>
      </div>
    </div>

    <script src="auth.js"></script>
    <script>
      // Login-specific logic
      const loginForm = document.getElementById('loginForm');
      const submitBtn = document.getElementById('submitBtn');
      const alertContainer = document.getElementById('alertContainer');

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const remember = document.getElementById('remember').checked;

        // Validate
        if (!isValidEmail(email)) {
          showAlert('Please enter a valid email address', 'error');
          document.getElementById('email').classList.add('error');
          return;
        }

        if (password.length < 6) {
          showAlert('Password must be at least 6 characters', 'error');
          document.getElementById('password').classList.add('error');
          return;
        }

        // Clear previous errors
        document.querySelectorAll('input').forEach((input) => {
          input.classList.remove('error');
        });

        // Submit
        await submitLogin(email, password, remember);
      });

      async function submitLogin(email, password, remember) {
        submitBtn.disabled = true;
        submitBtn.innerHTML =
          '<span class="spinner"></span> Signing in...';

        try {
          const response = await fetch(
            `${getApiUrl()}/auth/login`,
            {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                email,
                password,
              }),
            }
          );

          const data = await response.json();

          if (!response.ok) {
            showAlert(
              data.detail || 'Login failed. Please try again.',
              'error'
            );
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Sign In';
            return;
          }

          // Save auth data
          localStorage.setItem('token', data.token);
          localStorage.setItem('refreshToken', data.refreshToken);
          localStorage.setItem(
            'doctor',
            JSON.stringify({
              doctor_id: data.uid,
              email: email,
            })
          );

          if (remember) {
            localStorage.setItem('rememberEmail', email);
          }

          showAlert('Login successful! Redirecting...', 'success');

          // Redirect to dashboard
          setTimeout(() => {
            window.location.href = '../index.html';
          }, 1000);
        } catch (error) {
          console.error('Login error:', error);
          showAlert(
            'Connection error. Please check your internet and try again.',
            'error'
          );
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Sign In';
        }
      }

      function showAlert(message, type) {
        alertContainer.innerHTML = `
          <div class="alert ${type}">
            ${type === 'error' ? '❌' : '✅'} ${message}
          </div>
        `;

        if (type === 'success') {
          setTimeout(
            () => (alertContainer.innerHTML = ''),
            3000
          );
        }
      }

      // Pre-fill email if remembered
      window.addEventListener('load', () => {
        const rememberedEmail = localStorage.getItem('rememberEmail');
        if (rememberedEmail) {
          document.getElementById('email').value = rememberedEmail;
          document.getElementById('remember').checked = true;
        }
      });
    </script>
  </body>
</html>
